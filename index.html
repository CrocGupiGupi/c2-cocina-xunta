<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f5b45">
<title>Test Auxiliar de Cociña · Xunta de Galicia</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Test Cociña">
<style>
/* Fuentes incluidas en la app (licencia OFL, ver fuentes/): así se ven igual
   en cualquier dispositivo y sin conexión. */
@font-face{font-family:"Barlow Condensed";font-weight:600;font-display:swap;src:url(fuentes/barlow-condensed-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:"Barlow Condensed";font-weight:700;font-display:swap;src:url(fuentes/barlow-condensed-latin-700-normal.woff2) format("woff2")}
@font-face{font-family:"Source Sans 3";font-weight:400;font-display:swap;src:url(fuentes/source-sans-3-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"Source Sans 3";font-weight:600;font-display:swap;src:url(fuentes/source-sans-3-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:"Source Sans 3";font-weight:700;font-display:swap;src:url(fuentes/source-sans-3-latin-700-normal.woff2) format("woff2")}
/* «Etiqueta de cocina»: acero frío, tinta oscura y ámbar de etiqueta de
   trazabilidad. El rojo se reserva para errores y alertas. */
:root{
  --bg:#e9edef; --card:#ffffff; --txt:#14202b; --muted:#53606b;
  --brand:#0f5b45; --brand2:#0f5b45; --head:#0f5b45; --accent:#f2b705; --accent-txt:#2a2000;
  --ok:#1b7a4b; --ko:#c62828; --warn:#a15c00;
  --line:#cbd3d8; --shadow:0 1px 0 rgba(20,32,43,.06);
  --r:6px; --fs:16px; --pad:14px; --hh:calc(3.9375rem + env(safe-area-inset-top));
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --cuerpo:"Source Sans 3",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
html[data-theme="dark"]{
  --bg:#12181d; --card:#1b242b; --txt:#e6ecef; --muted:#9aa8b1;
  --brand:#1f7a5c; --brand2:#3cb58e; --head:#13372c; --accent:#f2b705; --accent-txt:#2a2000;
  --ok:#3ac47d; --ko:#ff6b60; --warn:#e0a33a;
  --line:#2c3943; --shadow:none;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
/* El ajuste «tamaño de letra» cambia --fs. Como aquí se fija el tamaño de
   referencia del documento, todos los rem de la hoja de estilos escalan con
   él: enunciados, opciones, temario y menús. Antes --fs solo afectaba a body
   y no se notaba, porque cada elemento traía su tamaño en px. */
html{font-size:clamp(var(--fs),calc(var(--fs) * .5 + .55vw),calc(var(--fs) * 1.75));scroll-padding:calc(var(--hh) + 8px) 0 84px;color-scheme:light}
html[data-theme="dark"]{color-scheme:dark}
body{
  background:var(--bg);color:var(--txt);
  font:1rem/1.5 var(--cuerpo);
  padding-bottom:calc(72px + env(safe-area-inset-bottom));
  overscroll-behavior-y:contain;
}
a{color:var(--brand2)}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}

/* ---------- cabecera ---------- */
header{
  position:sticky;top:0;z-index:50;background:var(--head);color:#fff;
  padding:calc(8px + env(safe-area-inset-top)) 14px 8px;
  display:flex;align-items:center;gap:10px;border-bottom:3px solid var(--accent)
}
header h1{font:700 1.375rem/1.1 var(--display);margin:0;flex:1;letter-spacing:.01em}
header h1 small{display:block;font:400 .75rem/1.3 var(--cuerpo);opacity:.85;letter-spacing:0}
.hbtn{background:rgba(255,255,255,.14);border:0;border-radius:var(--r);min-width:2.75rem;min-height:2.75rem;padding:7px 10px;font-size:.8125rem;font-weight:600;color:#fff}
.hbtn:active{background:rgba(255,255,255,.28)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
header :focus-visible,.nav :focus-visible{outline-color:#fff}

/* ---------- contenedor ---------- */
main{max-width:820px;margin:0 auto;padding:var(--pad)}
.view{display:none}
.view.on{display:block}
@media(prefers-reduced-motion:no-preference){.view.on{animation:fade .15s ease}}
@keyframes fade{from{opacity:0}to{opacity:1}}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px;box-shadow:var(--shadow)}
.card h2{margin:0 0 4px;font:700 1.3125rem/1.15 var(--display)}
.card h3{margin:14px 0 6px;font:600 1.0625rem/1.2 var(--display);color:var(--muted)}
.card p{margin:6px 0;color:var(--muted);font-size:.875rem}

.grid{display:grid;gap:10px}
.g2{grid-template-columns:repeat(2,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
@media(min-width:620px){.g2{grid-template-columns:repeat(4,1fr)}}

.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px;text-align:center}
.stat b{display:block;font:700 1.75rem/1.1 var(--display);color:var(--brand2)}
.stat span{font-size:.75rem;color:var(--muted);display:block;margin-top:2px}

/* Registro del día: una sola tira con cuatro lecturas, como una línea de un
   registro APPCC, en lugar de cuatro tarjetas iguales. */
.reg{display:grid;grid-template-columns:repeat(4,1fr);background:var(--card);border:1px solid var(--line);border-radius:var(--r);margin-bottom:14px}
.reg div{padding:9px 10px 8px;border-left:1px solid var(--line);min-width:0}
.reg div:first-child{border-left:0}
.reg b{display:block;font:700 1.5rem/1.05 var(--display);color:var(--txt);font-variant-numeric:tabular-nums}
.reg span{display:block;font-size:.75rem;color:var(--muted);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* Etiqueta de repaso: lo que caduca hoy. Es el único elemento ámbar de la
   pantalla de inicio, para que la mirada vaya primero a lo urgente. */
.etiq{display:block;width:100%;text-align:left;border:0;border-left:10px solid var(--accent);border-radius:var(--r);background:var(--card);color:var(--txt);padding:14px 16px;margin-bottom:12px;box-shadow:inset 0 0 0 1px var(--line)}
.etiq b{display:block;font:700 2.5rem/1 var(--display);font-variant-numeric:tabular-nums}
.etiq span{display:block;font:600 1.1875rem/1.2 var(--display);margin-top:2px}
.etiq small{display:block;color:var(--muted);font-size:.8125rem;margin-top:3px}
.etiq:active{background:color-mix(in srgb,var(--accent) 14%,var(--card))}

.btn{display:block;width:100%;min-height:52px;border:0;border-radius:var(--r);padding:12px 16px;font:700 1.1875rem/1.2 var(--display);letter-spacing:.01em;text-align:left;background:var(--brand);color:#fff;margin-bottom:10px;box-shadow:var(--shadow)}
.btn small{display:block;font:400 .8125rem/1.3 var(--cuerpo);letter-spacing:0;opacity:.88;margin-top:2px}
.btn:active{background:color-mix(in srgb,var(--brand) 85%,#000)}
.btn.sec{background:var(--card);color:var(--txt);border:1px solid var(--line)}
.btn.sec small{opacity:1;color:var(--muted)}
.btn.sec:active{background:var(--bg)}
.btn.gold{background:var(--accent);color:var(--accent-txt)}
.btn.ghost{background:transparent;border:1px dashed var(--line);color:var(--muted);text-align:center;font:600 1rem/1.2 var(--cuerpo)}
.btn.sm{padding:10px 12px;min-height:44px;font-size:1.0625rem;text-align:center;width:auto;display:inline-block;margin:0}

/* Lista de accesos: filas planas con filete, no tarjetas sueltas. */
.lista{background:var(--card);border:1px solid var(--line);border-radius:var(--r);margin-bottom:12px;overflow:hidden}
.lista .btn{margin:0;border-radius:0;border:0;border-top:1px solid var(--line);box-shadow:none;background:transparent;color:var(--txt);min-height:56px}
.lista .btn:first-child{border-top:0}
.lista .btn small{color:var(--muted);opacity:1}
.lista .btn:active{background:var(--bg)}

label.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
label.row:last-child{border-bottom:0}
label.row span{font-size:.9062rem}
label.row small{display:block;color:var(--muted);font-size:.75rem;font-weight:400}
select,input[type=number]{background:var(--bg);color:var(--txt);border:1px solid var(--line);border-radius:9px;padding:8px 10px;font:inherit;font-size:.875rem;min-width:96px}
input[type=checkbox]{width:20px;height:20px;accent-color:var(--brand2)}
input[type=range]{width:130px;accent-color:var(--brand2)}

.chips{display:flex;flex-wrap:wrap;gap:7px;margin:8px 0}
.chip{border:1px solid var(--line);background:var(--card);border-radius:var(--r);padding:9px 12px;min-height:40px;font-size:.875rem;color:var(--muted)}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}
.chip.mini{padding:6px 10px;min-height:32px;font-size:.8125rem}

/* ---------- test ---------- */
#barra{position:sticky;top:var(--hh);z-index:20;background:var(--bg);padding:8px var(--pad) 10px;margin:calc(-1 * var(--pad)) calc(-1 * var(--pad)) 4px;border-bottom:1px solid var(--line)}
.brow{display:flex;justify-content:space-between;align-items:center;font-size:.7812rem;color:var(--muted);margin-bottom:6px;gap:10px}
.brow b{color:var(--txt)}
#reloj.alerta{color:var(--ko);font-weight:700}
.prog{height:8px;background:var(--line);border-radius:2px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--brand2)}

.preg{font-size:1.125rem;font-weight:600;line-height:1.45;margin:14px 0 4px;max-width:68ch}
.pmeta{font-size:.8125rem;color:var(--muted);margin-bottom:12px}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;min-height:52px;text-align:left;background:var(--card);border:1px solid var(--line);border-left:6px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-bottom:8px;font-size:1rem;line-height:1.42}
.opt .let{flex:0 0 1.75rem;height:1.75rem;border-radius:4px;background:var(--bg);border:1px solid var(--line);display:grid;place-items:center;font:700 1.0625rem/1 var(--display);color:var(--muted)}
.opt.sel{border-color:var(--brand2);border-left-color:var(--brand2);background:color-mix(in srgb,var(--brand2) 8%,var(--card))}
.opt.sel .let{background:var(--brand2);color:#fff;border-color:var(--brand2)}
.opt.ok{border-color:var(--ok);border-left-color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,var(--card))}
.opt.ok .let{background:var(--ok);color:#fff;border-color:var(--ok)}
.opt.ko{border-color:var(--ko);border-left-color:var(--ko);background:color-mix(in srgb,var(--ko) 10%,var(--card))}
.opt.ko .let{background:var(--ko);color:#fff;border-color:var(--ko)}
.opt:disabled{cursor:default;opacity:1}

.exp{border-left:3px solid var(--brand2);background:color-mix(in srgb,var(--brand2) 6%,var(--card));border-radius:0 10px 10px 0;padding:11px 13px;margin:12px 0;font-size:.875rem}
.exp b{color:var(--brand2)}
.exp .ref{display:block;margin-top:6px;font-size:.75rem;color:var(--muted)}

.nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:60}
/* La barra inferior no escala: si creciera, taparía el contenido, porque el
   hueco que le reserva body (padding-bottom) es fijo. */
.nav button{flex:1;min-height:48px;background:none;border:0;border-top:3px solid transparent;padding:5px 2px;font:600 12px/1.1 var(--cuerpo);color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;border-radius:0}
.nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.nav button.on{color:var(--brand2);font-weight:700;border-top-color:var(--accent)}

.acciones{display:flex;gap:9px;margin-top:14px}
.acciones .btn{margin:0}

/* ---------- resultado ---------- */
.nota{text-align:center;padding:22px 12px}
.nota .big{font:700 4.5rem/1 var(--display);color:var(--brand2);font-variant-numeric:tabular-nums}
.nota .big.fail{color:var(--ko)}
.nota .sub{font-size:.875rem;color:var(--muted);margin-top:6px}
.veredicto{display:inline-block;margin-top:12px;padding:6px 16px;border-radius:var(--r);font:700 1.1875rem/1.2 var(--display)}
.veredicto.ap{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
.veredicto.no{background:color-mix(in srgb,var(--ko) 14%,transparent);color:var(--ko)}
table.res{width:100%;border-collapse:collapse;font-size:.875rem}
table.res td{padding:8px 0;border-bottom:1px solid var(--line)}
table.res td:last-child{text-align:right;font-weight:650}
table.res tr:last-child td{border-bottom:0}

/* ---------- barras de temas ---------- */
.tbar{display:grid;grid-template-columns:64px 1fr 52px;gap:9px;align-items:center;margin-bottom:8px;font-size:.8125rem}
.tbar .bg{height:9px;background:var(--line);border-radius:99px;overflow:hidden}
.tbar .bg i{display:block;height:100%;border-radius:99px}
.tbar em{font-style:normal;text-align:right;color:var(--muted);font-size:.75rem}

.mini{font-size:.7812rem;color:var(--muted)}
.sep{height:1px;background:var(--line);margin:14px 0}
.vacio{text-align:center;color:var(--muted);padding:34px 16px;font-size:.875rem}
.vacio svg{width:44px;height:44px;stroke:var(--line);fill:none;stroke-width:1.5;margin-bottom:10px}
.badge{display:inline-block;background:var(--accent);color:#2a2000;border-radius:6px;padding:1px 7px;font-size:.6875rem;font-weight:700;vertical-align:middle}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:88px;background:var(--txt);color:var(--bg);padding:11px 18px;border-radius:var(--r);font-size:.8438rem;font-weight:600;z-index:100;opacity:0;pointer-events:none;transition:.25s}
.toast.on{opacity:.95}
.fila{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.dias{display:flex;gap:4px;justify-content:space-between;margin-top:8px}
.dias div{flex:1;text-align:center;font-size:.625rem;color:var(--muted)}
.dias i{display:block;height:28px;border-radius:5px;background:var(--line);margin-bottom:4px}

/* ---------- lector del temario ---------- */
.lec{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px 16px;box-shadow:var(--shadow);line-height:1.62}
.lec h1{font:700 1.625rem/1.15 var(--display);margin:26px 0 10px;padding-bottom:7px;border-bottom:2px solid var(--brand2);color:var(--brand2)}
.lec h1:first-child{margin-top:0}
.lec h2{font:700 1.3125rem/1.2 var(--display);margin:22px 0 8px;color:var(--txt)}
.lec h3{font:600 1.125rem/1.25 var(--display);margin:18px 0 6px;color:var(--muted);text-transform:none;letter-spacing:0}
.lec h4{font-size:.875rem;margin:14px 0 5px}
.lec p{margin:9px 0;color:var(--txt);font-size:.9375rem}
.lec ul,.lec ol{padding-left:22px;margin:9px 0}
.lec li{margin:5px 0;font-size:.9375rem}
.lec p,.lec li{max-width:75ch}
.lec strong{color:var(--txt);font-weight:650}
.lec em{color:var(--muted)}
.lec code{background:var(--bg);border:1px solid var(--line);border-radius:5px;padding:1px 5px;font-size:.9em}
.lec pre{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px;overflow-x:auto;font-size:.7812rem;line-height:1.45}
.lec pre code{background:none;border:0;padding:0}
.lec blockquote{margin:14px 0;padding:12px 14px;border-left:4px solid var(--accent);background:color-mix(in srgb,var(--accent) 9%,var(--card));border-radius:0 10px 10px 0;font-size:.9062rem}
.lec blockquote p{margin:6px 0}
.lec blockquote p:first-child{margin-top:0}
.lec blockquote p:last-child{margin-bottom:0}
.lec hr{border:0;border-top:1px solid var(--line);margin:22px 0}
.lec a{color:var(--brand2);word-break:break-word}
/* bloques plegables: el esquema queda a la vista y el detalle se abre a voluntad */
.lec details{margin:12px 0;border:1px solid var(--line);border-radius:10px;background:var(--bg);overflow:hidden}
.lec details>summary{cursor:pointer;padding:10px 12px;font-size:.8438rem;font-weight:600;color:var(--brand2);list-style:none;user-select:none}
.lec details>summary::-webkit-details-marker{display:none}
.lec details>summary::before{content:'▸ ';display:inline-block;}
@media(prefers-reduced-motion:no-preference){.lec details>summary::before{transition:transform .15s}}
.lec details[open]>summary::before{transform:rotate(90deg)}
.lec details[open]>summary{border-bottom:1px solid var(--line)}
.lec details>*:not(summary){padding:0 12px}
.lec details>*:not(summary):first-of-type{padding-top:10px}
.lec details>*:not(summary):last-child{padding-bottom:10px}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:12px 0;border:1px solid var(--line);border-radius:var(--r)}
.tw table{border-collapse:collapse;width:100%;font-size:.8438rem;min-width:340px}
.tw th,.tw td{border-bottom:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
.tw th{background:var(--bg);font-weight:650;position:sticky;top:0}
.tw tr:last-child td{border-bottom:0}
.lec mark{background:var(--accent);color:#2a2000;border-radius:3px;padding:0 2px}
#idx{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-bottom:12px;max-height:280px;overflow-y:auto}
#idx a{display:block;padding:6px 0;font-size:.875rem;text-decoration:none;border-bottom:1px solid var(--line)}
#idx a:last-child{border-bottom:0}
#idx a.n2{padding-left:14px;font-size:.8125rem;color:var(--muted)}
.lbar{position:sticky;top:var(--hh);z-index:20;background:var(--bg);margin:calc(-1 * var(--pad)) calc(-1 * var(--pad)) 10px;padding:10px var(--pad);border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:center}
.lbar b{flex:1;font-size:.875rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.buscar{width:100%;background:var(--card);border:1px solid var(--line);border-radius:11px;padding:11px 13px;font:inherit;font-size:.9375rem;color:var(--txt);margin-bottom:10px}
.res-b{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px;cursor:pointer}
.res-b b{color:var(--brand2);font-size:.8125rem}
.res-b p{margin:5px 0 0;font-size:.8438rem;color:var(--muted);line-height:1.5}
.tema-c{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:13px 14px;margin-bottom:8px;width:100%;text-align:left;box-shadow:var(--shadow)}
.tema-c .cod{flex:0 0 3rem;height:3rem;border-radius:4px;background:var(--brand);color:#fff;display:grid;place-items:center;font:700 1.25rem/1 var(--display)}
.tema-c.esp .cod{background:var(--brand2)}
.tema-c .tx{flex:1;min-width:0}
.tema-c .tx b{display:block;font-size:.9062rem;line-height:1.3}
.tema-c .tx small{display:block;color:var(--muted);font-size:.75rem;margin-top:3px}
.tema-c .fl{color:var(--muted);font-size:1.125rem}
#arriba{position:fixed;right:14px;bottom:calc(84px + env(safe-area-inset-bottom));width:48px;height:48px;border-radius:var(--r);background:var(--brand);color:#fff;border:0;font-size:1.1875rem;box-shadow:0 3px 12px rgba(0,0,0,.28);display:none;z-index:55}
#arriba.on{display:block}
/* ============================================================
   ADAPTATIVO
   Puntos de ruptura: 340 (teléfono muy estrecho) · 600 (tableta
   vertical) · 1000 (barra lateral) · 1200 (dos columnas) · 1450+
   (la escala del texto crece con el ancho, hasta 4K).
   Los anchos de contenedor van en rem y en ch para que guarden
   proporción con el texto en cualquier pantalla.
   ============================================================ */
header{min-height:3.9375rem}
#v-lectura{max-width:calc(80ch + 3rem)}
main>.view{margin-inline:auto}

/* Cursor: estados de paso solo donde hay ratón */
@media(hover:hover){
  .lista .btn:hover,.tema-c:hover,.chip:hover,.res-b:hover{background:color-mix(in srgb,var(--brand2) 8%,var(--card))}
  .btn:hover{background:color-mix(in srgb,var(--brand) 88%,#000)}
  .btn.sec:hover,.btn.ghost:hover{background:color-mix(in srgb,var(--brand2) 8%,var(--card))}
  .opt:not(:disabled):hover{border-color:var(--brand2);border-left-color:var(--brand2)}
  .etiq:hover{background:color-mix(in srgb,var(--accent) 12%,var(--card))}
  .chip.on:hover{background:var(--brand)}
  .nav button:hover{color:var(--txt)}
}

/* Teléfonos muy estrechos (320-340 px) */
@media(max-width:340px){
  :root{--pad:10px}
  .reg{grid-template-columns:repeat(2,1fr)}
  .reg div:nth-child(3){border-left:0}
  .reg div:nth-child(n+3){border-top:1px solid var(--line)}
  .nav button{font-size:11px}
  header h1{font-size:1.125rem}
  .btn,.etiq{padding-left:12px;padding-right:12px}
}
@media(max-width:380px){ .reg span{white-space:normal} }

/* Teléfono apaisado: poca altura, así que se compacta la cabecera y la barra inferior */
@media(max-height:500px) and (orientation:landscape) and (max-width:999px){
  :root{--hh:calc(52px + env(safe-area-inset-top))}
  header{min-height:52px;padding-top:calc(4px + env(safe-area-inset-top));padding-bottom:4px}
  header h1 small{display:none}
  .hbtn{min-height:40px}
  body{padding-bottom:calc(52px + env(safe-area-inset-bottom))}
  .nav{padding-top:2px;padding-bottom:calc(2px + env(safe-area-inset-bottom))}
  .nav button{flex-direction:row;justify-content:center;gap:6px;min-height:44px;font-size:12px}
  .nav button svg{width:20px;height:20px}
  main{padding-left:max(var(--pad),env(safe-area-inset-left));padding-right:max(var(--pad),env(safe-area-inset-right))}
}

/* Tableta vertical y teléfono grande (600-999 px): una columna más ancha y accesos en dos columnas */
@media(min-width:600px) and (max-width:999px){
  :root{--pad:22px}
  main{max-width:46rem}
  .lista{display:grid;grid-template-columns:1fr 1fr}
  .lista .btn{border-top:0;border-bottom:1px solid var(--line)}
  .lista .btn:nth-child(odd){border-right:1px solid var(--line)}
  #blista{display:grid;grid-template-columns:1fr 1fr;gap:0 .75rem}
  #blista>h3{grid-column:1/-1}
  .nav{justify-content:center;gap:1rem}
  .nav button{flex:0 1 7.5rem}
}

/* Escritorio y tableta apaisada (>=1000 px): barra lateral en lugar de la inferior */
@media(min-width:1000px){
  :root{--rail:14rem;--pad:2.5rem}
  body{padding-bottom:0}
  header{padding-left:1.5rem;padding-right:1.5rem}
  .nav{top:var(--hh);right:auto;width:var(--rail);flex-direction:column;justify-content:flex-start;gap:2px;padding:1rem .625rem;border-top:0;border-right:1px solid var(--line);z-index:40;overflow-y:auto}
  .nav button{flex:none;flex-direction:row;justify-content:flex-start;gap:.875rem;min-height:3rem;padding:.625rem .875rem;font-size:1rem;border-top:0;border-left:4px solid transparent;border-radius:var(--r)}
  .nav button svg{width:1.375rem;height:1.375rem;flex:none}
  .nav button.on{border-left-color:var(--accent);background:color-mix(in srgb,var(--brand2) 10%,transparent)}
  main{max-width:none;margin:0 0 0 var(--rail);padding:1.75rem var(--pad) 4rem}
  main>.view{max-width:62rem}
  main>#v-play,main>#v-fin,main>#v-ajustes,main>#v-simulacro,main>#v-repaso{max-width:48rem}
  #barra,.lbar{margin-inline:0;padding-inline:0;margin-top:calc(-1.75rem);padding-top:.75rem}
  #arriba{bottom:1.5rem;right:1.5rem}
  .toast{bottom:1.5rem}
  .lista{display:grid;grid-template-columns:1fr 1fr}
  .lista .btn{border-top:0;border-bottom:1px solid var(--line)}
  .lista .btn:nth-child(odd){border-right:1px solid var(--line)}
  #blista{display:grid;grid-template-columns:repeat(auto-fill,minmax(21rem,1fr));gap:0 .875rem}
  #blista>h3{grid-column:1/-1}
}

/* Pantallas anchas (>=1200 px): paneles en dos columnas */
@media(min-width:1200px){
  main>#v-inicio,main>#v-test,main>#v-stats,main>#v-temario{max-width:80rem}

  /* Inicio: lectura del día y accesos a la izquierda, historial a la derecha */
  #v-inicio.on{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);gap:0 1.75rem;align-items:start}
  #v-inicio>*{grid-column:1}
  #v-inicio>.reg{grid-column:1/-1}
  #v-inicio>.card{grid-column:2;grid-row:2 / span 4}

  /* Test por tema: temas a la izquierda, configuración fija a la derecha */
  #v-test.on{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(19rem,1fr);gap:0 1.75rem;align-items:start}
  #v-test>.card:last-child{position:sticky;top:calc(var(--hh) + 1rem)}

  /* Datos */
  #v-stats.on{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0 1.75rem;align-items:start}
  #v-stats>.card:nth-child(3){grid-column:2;grid-row:1 / span 2}
  #v-stats>.btn{grid-column:1/-1}

  /* Lector: texto y, al lado, el índice del tema siempre visible */
  main>#v-lectura{max-width:calc(80ch + 3rem + 2rem + 17rem)}
  #v-lectura.on{display:grid;grid-template-columns:minmax(0,calc(80ch + 3rem)) 17rem;gap:0 2rem;align-items:start}
  #v-lectura>.lbar,#v-lectura>.buscar{grid-column:1/-1}
  #v-lectura>.lec{grid-column:1;grid-row:3}
  #v-lectura>#idx{display:block!important;grid-column:2;grid-row:3;position:sticky;top:calc(var(--hh) + 5.5rem);max-height:calc(100vh - var(--hh) - 7rem);max-height:calc(100dvh - var(--hh) - 7rem)}
  #lIdx{display:none}
  #blista{grid-template-columns:repeat(auto-fill,minmax(23rem,1fr))}
}

/* Pantallas muy anchas: la barra lateral y el contenido ganan aire */
@media(min-width:1800px){
  main>#v-inicio,main>#v-test,main>#v-stats,main>#v-temario{max-width:88rem}
}

@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}

@media print{.nav,header,#barra,.lbar,#arriba{display:none}.lec{border:0;box-shadow:none;padding:0}}
</style>
</head>
